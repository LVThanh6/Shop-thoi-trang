<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giao diện Quản trị Sản phẩm - Premium Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #c1a35f;
            --bg-dark: #0f1113;
            --card-bg: rgba(255, 255, 255, 0.05);
            --text-main: #e0e0e0;
            --text-dim: #a0a0a0;
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 100px;
        }

        /* --- Sidebar & Header --- */
        header {
            background: rgba(15, 17, 19, 0.8);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            padding: 20px 5%;
            position: sticky;
            top: 0;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: 600;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .stats {
            display: flex;
            gap: 20px;
            font-size: 14px;
        }

        .stat-item span {
            color: var(--primary);
            font-weight: 600;
        }

        /* --- Toolbar --- */
        .toolbar {
            padding: 20px 5%;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
            background: var(--glass);
        }

        .search-box {
            flex: 1;
            min-width: 300px;
            position: relative;
        }

        .search-box input {
            width: 100%;
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 12px 20px;
            border-radius: 30px;
            color: white;
            outline: none;
            transition: 0.3s;
        }

        .search-box input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 15px rgba(193, 163, 95, 0.2);
        }

        .category-tabs {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 5px;
            scrollbar-width: none;
        }

        .category-tabs::-webkit-scrollbar {
            display: none;
        }

        .tab {
            padding: 8px 20px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            cursor: pointer;
            white-space: nowrap;
            font-size: 14px;
            transition: 0.3s;
        }

        .tab:hover,
        .tab.active {
            background: var(--primary);
            color: black;
            border-color: var(--primary);
        }

        /* --- Grid --- */
        .container {
            padding: 30px 5%;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }

        .product-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 15px;
            padding: 15px;
            transition: transform 0.3s, border-color 0.3s;
            position: relative;
        }

        .product-card:hover {
            transform: translateY(-5px);
            border-color: var(--primary);
        }

        .product-card img {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 15px;
            background: #1a1a1a;
        }

        .product-info {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .id-badge {
            font-size: 10px;
            background: rgba(255, 255, 255, 0.1);
            padding: 2px 8px;
            border-radius: 4px;
            width: fit-content;
            color: var(--text-dim);
        }

        .input-group label {
            display: block;
            font-size: 11px;
            color: var(--text-dim);
            margin-bottom: 4px;
        }

        .input-group input {
            width: 100%;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border);
            padding: 8px 12px;
            border-radius: 6px;
            color: white;
            font-size: 14px;
        }

        .input-group input:focus {
            border-color: var(--primary);
            outline: none;
        }

        .changed {
            border-color: var(--primary) !important;
            box-shadow: 0 0 10px rgba(193, 163, 95, 0.1);
        }

        .changed::after {
            content: 'Đã sửa';
            position: absolute;
            top: 10px;
            right: 10px;
            background: var(--primary);
            color: black;
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 20px;
            font-weight: 600;
        }

        /* --- Footer Menu --- */
        .admin-actions {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            padding: 15px 30px;
            border-radius: 50px;
            display: flex;
            gap: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            z-index: 2000;
        }

        .btn {
            padding: 10px 25px;
            border-radius: 25px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: 0.3s;
        }

        .btn-primary {
            background: var(--primary);
            color: black;
        }

        .btn-primary:hover {
            background: #d4b570;
            box-shadow: 0 0 20px rgba(193, 163, 95, 0.4);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }

        /* --- Export Modal --- */
        #modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 3000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-content {
            background: #1a1c1e;
            border: 1px solid var(--border);
            padding: 30px;
            border-radius: 20px;
            width: 100%;
            max-width: 600px;
        }

        textarea {
            width: 100%;
            height: 300px;
            background: #0f1113;
            border: 1px solid var(--border);
            color: #00ff00;
            font-family: monospace;
            padding: 15px;
            margin: 20px 0;
            border-radius: 10px;
        }

        /* Loading */
        .loader {
            text-align: center;
            padding: 50px;
            font-size: 20px;
            color: var(--primary);
        }
    </style>
</head>

<body>

    <header>
        <div class="logo">Shop Fashion Admin</div>
        <div class="stats">
            <div class="stat-item">Tổng sản phẩm: <span id="total-count">0</span></div>
            <div class="stat-item">Đã chỉnh sửa: <span id="changed-count">0</span></div>
        </div>
    </header>

    <div class="toolbar">
        <div class="search-box">
            <input type="text" id="search" placeholder="Tìm kiếm theo ID hoặc Tên sản phẩm..."
                oninput="filterProducts()">
        </div>
        <div class="category-tabs" id="tabs-container">
            <div class="tab active" onclick="setCategory('all')">Tất cả</div>
            <!-- Tabs dynamic -->
        </div>
    </div>

    <div class="container">
        <div id="loader" class="loader">Đang tải dữ liệu từ toàn hệ thống...</div>
        <div class="grid" id="product-grid"></div>
    </div>

    <div class="admin-actions">
        <button class="btn btn-secondary" onclick="viewChanges()">Xem thay đổi</button>
        <button class="btn btn-primary" onclick="exportChanges()">Lưu & Xuất Dữ liệu (Save)</button>
    </div>

    <div id="modal">
        <div class="modal-content">
            <h3>Xuất Dữ liệu Chỉnh sửa</h3>
            <p style="font-size: 14px; color: var(--text-dim); margin-top: 10px;">
                Vui lòng sao chép đoạn mã bên dưới và dán vào cửa sổ Chat với AI để tôi cập nhật file cho bạn.
            </p>
            <textarea id="export-json" readonly></textarea>
            <div style="display: flex; gap: 10px; justify-content: flex-end;">
                <button class="btn btn-secondary" onclick="closeModal()">Đóng</button>
                <button class="btn btn-primary" id="copy-btn" onclick="copyResult()">Sao chép mã</button>
            </div>
        </div>
    </div>

    <script>
        const categories = [
            { id: 'shirts', name: 'Áo', file: 'data/shirts.json' },
            { id: 'pants', name: 'Quần', file: 'data/pants.json' },
            { id: 'shoes', name: 'Giày', file: 'data/shoes.json' },
            { id: 'vests', name: 'Vest', file: 'data/vests.json' },
            { id: 'perfumes', name: 'Nước Hoa', file: 'data/perfumes.json' },
            { id: 'watches', name: 'Đồng Hồ', file: 'data/watches.json' },
            { id: 'accessories', name: 'Phụ Kiện', file: 'data/accessories.json' },
            { id: 'caps', name: 'Mũ Nam', file: 'data/caps.json' },
            { id: 'jackets', name: 'Áo Khoác', file: 'data/jackets.json' }
        ];

        let allProducts = [];
        let originalData = new Map();
        let currentCategory = 'all';

        // Tải toàn bộ dữ liệu
        async function loadAllData() {
            try {
                const promises = categories.map(async cat => {
                    const res = await fetch(cat.file);
                    const data = await res.json();
                    return data.map(p => {
                        const product = { ...p, category: cat.id, categoryName: cat.name };
                        // Lưu bản gốc để so sánh
                        originalData.set(p.id, JSON.stringify({ name: p.name, price: p.price }));
                        return product;
                    });
                });

                const results = await Promise.all(promises);
                allProducts = results.flat();

                document.getElementById('loader').style.display = 'none';
                document.getElementById('total-count').innerText = allProducts.length;

                renderTabs();
                renderProducts();
            } catch (err) {
                console.error(err);
                document.getElementById('loader').innerHTML = '<span style="color:red">Lỗi tải dữ liệu. Vui lòng chạy qua Live Server!</span>';
            }
        }

        function renderTabs() {
            const container = document.getElementById('tabs-container');
            categories.forEach(cat => {
                const tab = document.createElement('div');
                tab.className = 'tab';
                tab.innerText = cat.name;
                tab.onclick = () => setCategory(cat.id);
                tab.id = `tab-${cat.id}`;
                container.appendChild(tab);
            });
        }

        function setCategory(id) {
            currentCategory = id;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            if (id === 'all') document.querySelector('.tab').classList.add('active');
            else document.getElementById(`tab-${id}`).classList.add('active');
            renderProducts();
        }

        function filterProducts() {
            renderProducts();
        }

        function renderProducts() {
            const grid = document.getElementById('product-grid');
            const searchTerm = document.getElementById('search').value.toLowerCase();

            grid.innerHTML = '';

            const filtered = allProducts.filter(p => {
                const matchesCat = currentCategory === 'all' || p.category === currentCategory;
                const matchesSearch = p.id.toLowerCase().includes(searchTerm) || p.name.toLowerCase().includes(searchTerm);
                return matchesCat && matchesSearch;
            });

            filtered.forEach(p => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.id = `card-${p.id}`;

                // Fix image path if needed
                let imgSrc = p.img.startsWith('../') ? p.img.substring(3) : p.img;

                card.innerHTML = `
                    <img src="${imgSrc}" loading="lazy" onerror="this.src='img/no-img.jpg'">
                    <div class="product-info">
                        <div style="display:flex; justify-content:space-between; align-items:center">
                            <span class="id-badge">${p.id}</span>
                            <span style="font-size: 10px; color: var(--primary)">${p.categoryName}</span>
                        </div>
                        <div class="input-group">
                            <label>Tên Sản Phẩm</label>
                            <input type="text" value="${p.name}" oninput="updateProduct('${p.id}', 'name', this.value)">
                        </div>
                        <div class="input-group">
                            <label>Giá (VNĐ)</label>
                            <input type="number" value="${p.price}" oninput="updateProduct('${p.id}', 'price', this.value)">
                        </div>
                    </div>
                `;

                // Kiểm tra xem đã khác gốc chưa
                checkChanged(p.id, card);
                grid.appendChild(card);
            });
        }

        function updateProduct(id, field, value) {
            const product = allProducts.find(p => p.id === id);
            if (field === 'price') value = parseInt(value) || 0;
            product[field] = value;

            const card = document.getElementById(`card-${id}`);
            checkChanged(id, card);
            updateStats();
        }

        function checkChanged(id, card) {
            const product = allProducts.find(p => p.id === id);
            const original = JSON.parse(originalData.get(id));

            if (product.name !== original.name || product.price !== original.price) {
                card.classList.add('changed');
            } else {
                card.classList.remove('changed');
            }
        }

        function updateStats() {
            let changed = 0;
            allProducts.forEach(p => {
                const original = JSON.parse(originalData.get(p.id));
                if (p.name !== original.name || p.price !== original.price) changed++;
            });
            document.getElementById('changed-count').innerText = changed;
        }

        function viewChanges() {
            const changed = allProducts.filter(p => {
                const original = JSON.parse(originalData.get(p.id));
                return p.name !== original.name || p.price !== original.price;
            });

            if (changed.length === 0) {
                alert("Chưa có thay đổi nào!");
                return;
            }

            // Lọc grid chỉ hiện những card có class changed
            const cards = document.querySelectorAll('.product-card');
            cards.forEach(c => {
                if (!c.classList.contains('changed')) c.style.display = 'none';
            });

            const btn = document.querySelector('button[onclick="viewChanges()"]');
            btn.innerText = "Hiện tất cả";
            btn.onclick = () => {
                renderProducts();
                btn.innerText = "Xem thay đổi";
                btn.onclick = viewChanges;
            };
        }

        function exportChanges() {
            const changed = [];
            allProducts.forEach(p => {
                const original = JSON.parse(originalData.get(p.id));
                if (p.name !== original.name || p.price !== original.price) {
                    changed.push({
                        id: p.id,
                        name: p.name,
                        price: p.price,
                        category: p.category
                    });
                }
            });

            if (changed.length === 0) {
                alert("Bạn chưa sửa đổi bất kỳ sản phẩm nào!");
                return;
            }

            const exportObj = {
                type: "MANUAL_RENAME_UPDATE",
                timestamp: new Date().toISOString(),
                updates: changed
            };

            const jsonStr = JSON.stringify(exportObj, null, 2);
            document.getElementById('export-json').value = jsonStr;
            document.getElementById('modal').style.display = 'flex';
        }

        function copyResult() {
            const textarea = document.getElementById('export-json');
            textarea.select();
            document.execCommand('copy');

            const btn = document.getElementById('copy-btn');
            btn.innerText = "Đã sao chép!";
            setTimeout(() => btn.innerText = "Sao chép mã", 2000);
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
        }

        // Initialize
        loadAllData();
    </script>
</body>

</html>
