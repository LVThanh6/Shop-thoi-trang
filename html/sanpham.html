<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sản phẩm</title>
    <link rel="stylesheet" href="../assets/css/header2.css">
    <link rel="stylesheet" href="../assets/css/footers.css">
    <link rel="stylesheet" href="../assets/css/main.css">
    <link rel="stylesheet" href="../assets/css/filter.css">
    <link rel="stylesheet" href="../assets/css/banner.css">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .site-wrapper {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Chừa chỗ cho header (nếu cố định hoặc cao) */
        #banner-placeholder,
        .content-wrapper,
        #footer-placeholder {
            margin-top: 20px;
        }

        /* Header chiếm 100% chiều rộng */
        #header-placeholder {
            width: 100%;
            margin: 0;
            padding: 0;
        }

        #header-placeholder header {
            width: 100% !important;
            max-width: 100% !important;
        }

        .content-wrapper {
            display: flex;
            width: 100%;
            max-width: 1440px;
            margin: 0 auto;
            gap: 20px;
            padding: 20px;
            box-sizing: border-box;
        }

        .filter-area {
            width: 320px;
            min-width: 320px;
            background: #fff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 12px rgba(0, 0, 0, .08);
        }

        .product-area {
            flex: 1;
            background: #fff;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 12px rgba(0, 0, 0, .08);
            min-height: 500px;
        }

        .product-area h2 {
            margin: 0 0 14px;
            font-size: 1.2rem;
        }

        .product-placeholder {
            min-height: 420px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #555;
            border: 2px dashed #ddd;
            border-radius: 8px;
            background: #fafafa;
        }

        /* Nếu bạn muốn nội dung filter luôn xuất hiện từng phần, đảm bảo không bị cuộn riêng */
        .filter-inner {
            max-height: 80vh;
            overflow-y: auto;
        }
    </style>
</head>

<body>
    <div class="site-wrapper">
        <div id="header-placeholder"></div>
        <div id="banner-placeholder"></div>

        <div class="content-wrapper">
            <div class="filter-area" id="filter-placeholder">
                <div class="filter-inner">
                    <!-- Khung bộ lọc sẽ nạp từ filter.html -->
                </div>
            </div>

            <div class="product-area">
                <h2>Danh sách sản phẩm</h2>
                <div class="product-placeholder" id="product-placeholder">
                    (Chừa khoảng trống này để bạn thêm sản phẩm sau)
                </div>
            </div>
        </div>

        <div id="footer-placeholder"></div>
    </div>

    <script>
        // Thay thế đoạn script cũ bằng đoạn này
        async function loadHtml(id, path, inner = true) {
            try {
                const res = await fetch(path);
                const text = await res.text();

                const targetElement = document.getElementById(id);

                // 1. Chèn HTML vào DOM
                targetElement.innerHTML = text;

                // 2. Tìm tất cả các thẻ <script> vừa được chèn vào
                const scripts = targetElement.querySelectorAll('script');

                // 3. Tạo thẻ <script> mới và chép nội dung sang để ép trình duyệt thực thi
                scripts.forEach(oldScript => {
                    const newScript = document.createElement('script');

                    // Nếu là script link ra ngoài (src)
                    if (oldScript.src) {
                        newScript.src = oldScript.src;
                    }
                    // Nếu là script viết trực tiếp bên trong (inline)
                    else {
                        newScript.textContent = oldScript.textContent;
                    }

                    // Thêm vào body để chạy, sau đó xóa đi cho nhẹ DOM
                    document.body.appendChild(newScript);
                    oldScript.remove(); // Xóa thẻ script "chết" cũ đi
                });

            } catch (e) {
                console.error('Không tải được', path, e);
            }
        }

        // Nạp các phần từ file riêng
        loadHtml('header-placeholder', './header.html');
        loadHtml('banner-placeholder', './banner.html');
        loadHtml('filter-placeholder', './filter.html');
        loadHtml('footer-placeholder', './footer.html');
    </script>
</body>

</html>
