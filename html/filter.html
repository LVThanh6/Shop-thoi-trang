<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bộ lọc sản phẩm</title>
    <link rel="stylesheet" href="../assets/css/filter.css">
</head>

<body>
    <aside class="filter-drawer">
        <div class="filter-header">

            <button class="filter-btn" type="button"
                onclick="document.querySelectorAll('.filter-drawer input[type=checkbox]').forEach(c=>c.checked=false);">Đặt
                lại</button>

            <div>
                <img src="../assets/img/filter/Group 3.svg" alt="">
                <h2>Bộ lọc</h2>
            </div>

        </div>

        <div class="filter-section">
            <h3>Áo Thun</h3>
            <div class="section-body">
                <label class="filter-option"><input type="checkbox" checked> Áo thun in hình <span>38</span></label>
                <label class="filter-option"><input type="checkbox" checked> Áo thun trơn <span>50</span></label>
                <label class="filter-option"><input type="checkbox"> Tank top <span>45</span></label>
                <label class="filter-option"><input type="checkbox"> Áo thun oversize <span>30</span></label>
                <label class="filter-option"><input type="checkbox"> Áo thun polo <span>20</span></label>
            </div>
        </div>

        <div class="filter-section">
            <h3>Áo Sơ Mi</h3>
            <div class="section-body">
                <label class="filter-option"><input type="checkbox" checked> Sơ mi trơn <span>38</span></label>
                <label class="filter-option"><input type="checkbox" checked> Sơ mi kẻ sọc <span>50</span></label>
                <label class="filter-option"><input type="checkbox"> Sơ mi họa tiết <span>45</span></label>
                <label class="filter-option"><input type="checkbox"> Sơ mi denim <span>30</span></label>
            </div>
        </div>

        <div class="filter-section">
            <h3>Phong cách</h3>
            <div class="section-body">
                <label class="filter-option"><input type="checkbox" checked> Thể thao <span>38</span></label>
                <label class="filter-option"><input type="checkbox" checked> Công sở <span>50</span></label>
                <label class="filter-option"><input type="checkbox"> Basic <span>45</span></label>
                <label class="filter-option"><input type="checkbox"> Thanh lịch <span>30</span></label>
            </div>
        </div>

        <div class="filter-section">
            <h3>Giá thành</h3>
            <div class="section-body">
                <div class="range-slider">
                    <div class="track"></div>
                    <div class="range" id="rangeFill"></div>
                    <input type="range" id="priceRangeMin" min="0" max="5000000" step="10000" value="100000">
                    <input type="range" id="priceRangeMax" min="0" max="5000000" step="10000" value="500000">
                </div>
                <div class="price-range">
                    <input type="number" id="priceMin" value="100000" min="0" max="5000000" step="10000"
                        inputmode="numeric" pattern="[0-9]*" placeholder="Tối thiểu">
                    <input type="number" id="priceMax" value="500000" min="0" max="5000000" step="10000"
                        inputmode="numeric" pattern="[0-9]*" placeholder="Tối đa">
                </div>
            </div>
        </div>

        <div class="divider"></div>


    </aside>

    <script>
        const minInput = document.getElementById('priceMin');
        const maxInput = document.getElementById('priceMax');
        const rangeMin = document.getElementById('priceRangeMin');
        const rangeMax = document.getElementById('priceRangeMax');
        const rangeFill = document.getElementById('rangeFill');

        const RANGE_MIN = 0;
        const RANGE_MAX = 5000000;
        const STEP_VALUE = 10000;

        function normalizeValue(v) {
            const n = Number(v);
            if (Number.isNaN(n)) return RANGE_MIN;
            return Math.min(RANGE_MAX, Math.max(RANGE_MIN, Math.floor(n / STEP_VALUE) * STEP_VALUE));
        }
        function updateFromRange(source) {
            let minVal = normalizeValue(rangeMin.value);
            let maxVal = normalizeValue(rangeMax.value);

            // 👇 THÊM LOGIC: Đảm bảo luôn có khoảng cách tối thiểu bằng STEP_VALUE
            if (maxVal - minVal < STEP_VALUE) {
                if (source === rangeMin) {
                    // Nếu đang kéo thanh Min chạm vào thanh Max, ép thanh Min lùi lại
                    minVal = maxVal - STEP_VALUE;
                    rangeMin.value = minVal;
                } else {
                    // Nếu đang kéo thanh Max chạm vào thanh Min, ép thanh Max tiến lên
                    maxVal = minVal + STEP_VALUE;
                    rangeMax.value = maxVal;
                }
            }

            minInput.value = minVal;
            maxInput.value = maxVal;

            const percentMin = (minVal - RANGE_MIN) / (RANGE_MAX - RANGE_MIN) * 100;
            const percentMax = (maxVal - RANGE_MIN) / (RANGE_MAX - RANGE_MIN) * 100;

            rangeFill.style.left = percentMin + '%';
            rangeFill.style.width = (percentMax - percentMin) + '%';
        }
        function updateFromInput() {
            let minVal = normalizeValue(minInput.value);
            let maxVal = normalizeValue(maxInput.value);
            if (minVal > maxVal) {
                [minVal, maxVal] = [maxVal, minVal];
            }
            rangeMin.value = minVal;
            rangeMax.value = maxVal;
            minInput.value = minVal;
            maxInput.value = maxVal;
        }

        rangeMin.addEventListener('input', (evt) => updateFromRange(evt.target));
        rangeMax.addEventListener('input', (evt) => updateFromRange(evt.target));

        minInput.addEventListener('change', () => {
            updateFromInput();
            updateFromRange(rangeMin);
        });
        maxInput.addEventListener('change', () => {
            updateFromInput();
            updateFromRange(rangeMin);
        });

        document.querySelectorAll('.filter-section h3').forEach((header) => {
            header.addEventListener('click', () => {
                const section = header.parentElement;
                section.classList.toggle('collapsed');
            });
        });

        // Khởi tạo giá trị đúng đầu
        updateFromInput();
        updateFromRange(rangeMin);
    </script>
</body>

</html>
