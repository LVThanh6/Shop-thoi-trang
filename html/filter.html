<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bộ lọc sản phẩm</title>
    <style>
        @font-face {
            font-family: 'Lato';
            src: url('../assets/font/Lato/Lato\ Bold.ttf') format('truetype');
            font-weight: 300;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Lato', sans-serif;
        }

        body {
            margin: 0;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f5f5;
        }

        .filter-drawer {
            width: 320px;
            height: 100vh;
            background: #111;
            color: #fff;
            display: flex;
            flex-direction: column;
            padding: 16px;
            box-sizing: border-box;
            overflow-y: auto;
            border-right: 1px solid rgba(255, 255, 255, 0.1);
        }

        .filter-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .filter-header button {
            background: #EDEDEE;
            border: 3px solid #888888;
            color: #888888;
            padding: 6px 18px;
            border-radius: 12px;
            cursor: pointer;
        }

        .filter-header div {

            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid #ffffff;
            padding: 10px 20px;
            border-radius: 3px;
        }

        .filter-header div h2 {
            margin: 0;
            font-size: 16px;

        }



        .filter-section {
            margin-bottom: 20px;
        }

        .filter-section h3 {
            margin: 0 0 8px;
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border-bottom: 1px solid #333;
            padding-bottom: 8px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .filter-section h3::after {
            content: '\25BC';
            font-size: 0.7rem;
            transition: transform 0.2s ease;
        }

        .filter-section.collapsed h3::after {
            transform: rotate(-90deg);
        }

        .filter-section .section-body {
            overflow: hidden;
            max-height: 1000px;
            opacity: 1;
            transition: max-height 0.3s ease, opacity 0.2s ease;
        }

        .filter-section.collapsed .section-body {
            max-height: 0;
            opacity: 0;
        }

        .filter-option {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
            gap: 10px;
            font-size: 0.9rem;
        }

        .filter-option input[type="checkbox"] {
            -webkit-appearance: none;
            appearance: none;
            width: 24px;
            height: 24px;
            border: 2px solid #c0c0c0;
            border-radius: 4px;
            background: #111;
            cursor: pointer;
            position: relative;
            display: flex;
            vertical-align: middle;
            margin: 0;
        }

        .filter-option input[type="checkbox"]::after {
            content: '';
            position: absolute;
            width: 6px;
            height: 10px;
            border-right: 2px solid transparent;
            border-bottom: 2px solid transparent;
            transform: rotate(45deg);
            top: 3px;
            left: 5px;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .filter-option input[type="checkbox"]:checked {
            background: #ffffff;
            border-color: #000000;
        }

        .filter-option input[type="checkbox"]:checked::after {
            opacity: 1;
            border-color: #000000;
            top: 2px;
            left: 6px;
        }

        .filter-option input[type="checkbox"]:checked::after {
            border-color: #000000;
        }

        .filter-option span {
            background: #1f1f1f;
            border-radius: 999px;
            padding: 2px 8px;
            font-size: 0.75rem;
            color: #d5d5d5;
            margin-left: auto;
            transition: background 0.2s ease, color 0.2s ease;
        }

        .filter-option input[type="checkbox"]:checked~span {
            background: #ffffff;
            color: #000000;
        }

        .price-range {
            margin: 8px 0 4px;
            display: flex;
            justify-content: space-between;
            gap: 8px;
        }

        .price-range input {
            width: 100%;
            border: 1px solid #ffffff;
            background: #0f0f0f;
            color: #fff;
            border-radius: 8px;
            padding: 8px 10px;
        }

        .range-slider {
            position: relative;
            width: 100%;
            height: 48px;
            margin: 12px 0 8px;
            user-select: none;
        }

        .range-slider input[type="range"] {
            position: absolute;
            width: 100%;
            height: 6px;
            top: 27px;
            left: 0;
            margin: 0;
            background: none;
            pointer-events: none;
            -webkit-appearance: none;
        }

        .range-slider input[type="range"]::-webkit-slider-thumb {
            pointer-events: all;
            position: relative;

            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            background: #fff;
            border: 2px solid #ffffff;
            border-radius: 50%;
            cursor: pointer;

            margin-top: -6px;
            /* 👈 THÊM DÒNG NÀY */
        }

        .range-slider input[type="range"]::-moz-range-thumb {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #fff;
            border: 2px solid #ffffff;
            cursor: pointer;
        }

        .range-slider input[type="range"]::-webkit-slider-runnable-track {
            height: 6px;
            border-radius: 6px;
            background: #ffffff;
        }

        .range-slider .track {
            position: absolute;
            top: 27px;
            left: 0;
            width: 100%;
            height: 6px;
            background: #ffffff;
            border-radius: 6px;

        }

        .range-slider .range {
            position: absolute;
            top: 27px;
            height: 6px;
            background: #007bff;
            border-radius: 6px;
            transition: left 0.15s ease, width 0.15s ease;
        }

        .divider {
            border-top: 1px solid #333;
            margin: 12px 0;
        }

        @media screen and (max-width: 320px) {
            .filter-drawer {
                width: 100vw;
            }
        }
    </style>
</head>

<body>
    <aside class="filter-drawer">
        <div class="filter-header">

            <button class="filter-btn" type="button"
                onclick="document.querySelectorAll('.filter-drawer input[type=checkbox]').forEach(c=>c.checked=false);">Đặt
                lại</button>

            <div>
                <img src="../assets/img/filter/Group 3.svg" alt="">
                <h2>Bộ lọc</h2>
            </div>

        </div>

        <div class="filter-section">
            <h3>Áo Thun</h3>
            <div class="section-body">
                <label class="filter-option"><input type="checkbox" checked> Áo thun in hình <span>38</span></label>
                <label class="filter-option"><input type="checkbox" checked> Áo thun trơn <span>50</span></label>
                <label class="filter-option"><input type="checkbox"> Tank top <span>45</span></label>
                <label class="filter-option"><input type="checkbox"> Áo thun oversize <span>30</span></label>
                <label class="filter-option"><input type="checkbox"> Áo thun polo <span>20</span></label>
            </div>
        </div>

        <div class="filter-section">
            <h3>Áo Sơ Mi</h3>
            <div class="section-body">
                <label class="filter-option"><input type="checkbox" checked> Sơ mi trơn <span>38</span></label>
                <label class="filter-option"><input type="checkbox" checked> Sơ mi kẻ sọc <span>50</span></label>
                <label class="filter-option"><input type="checkbox"> Sơ mi họa tiết <span>45</span></label>
                <label class="filter-option"><input type="checkbox"> Sơ mi denim <span>30</span></label>
            </div>
        </div>

        <div class="filter-section">
            <h3>Phong cách</h3>
            <div class="section-body">
                <label class="filter-option"><input type="checkbox" checked> Thể thao <span>38</span></label>
                <label class="filter-option"><input type="checkbox" checked> Công sở <span>50</span></label>
                <label class="filter-option"><input type="checkbox"> Basic <span>45</span></label>
                <label class="filter-option"><input type="checkbox"> Thanh lịch <span>30</span></label>
            </div>
        </div>

        <div class="filter-section">
            <h3>Giá thành</h3>
            <div class="section-body">
                <div class="range-slider">
                    <div class="track"></div>
                    <div class="range" id="rangeFill"></div>
                    <input type="range" id="priceRangeMin" min="0" max="5000000" step="10000" value="100000">
                    <input type="range" id="priceRangeMax" min="0" max="5000000" step="10000" value="500000">
                </div>
                <div class="price-range">
                    <input type="number" id="priceMin" value="100000" min="0" max="5000000" step="10000"
                        inputmode="numeric" pattern="[0-9]*" placeholder="Tối thiểu">
                    <input type="number" id="priceMax" value="500000" min="0" max="5000000" step="10000"
                        inputmode="numeric" pattern="[0-9]*" placeholder="Tối đa">
                </div>
            </div>
        </div>

        <div class="divider"></div>


    </aside>

    <script>
        const minInput = document.getElementById('priceMin');
        const maxInput = document.getElementById('priceMax');
        const rangeMin = document.getElementById('priceRangeMin');
        const rangeMax = document.getElementById('priceRangeMax');
        const rangeFill = document.getElementById('rangeFill');

        const RANGE_MIN = 0;
        const RANGE_MAX = 5000000;
        const STEP_VALUE = 10000;

        function normalizeValue(v) {
            const n = Number(v);
            if (Number.isNaN(n)) return RANGE_MIN;
            return Math.min(RANGE_MAX, Math.max(RANGE_MIN, Math.floor(n / STEP_VALUE) * STEP_VALUE));
        }
        function updateFromRange(source) {
            let minVal = normalizeValue(rangeMin.value);
            let maxVal = normalizeValue(rangeMax.value);

            // 👇 THÊM LOGIC: Đảm bảo luôn có khoảng cách tối thiểu bằng STEP_VALUE
            if (maxVal - minVal < STEP_VALUE) {
                if (source === rangeMin) {
                    // Nếu đang kéo thanh Min chạm vào thanh Max, ép thanh Min lùi lại
                    minVal = maxVal - STEP_VALUE;
                    rangeMin.value = minVal;
                } else {
                    // Nếu đang kéo thanh Max chạm vào thanh Min, ép thanh Max tiến lên
                    maxVal = minVal + STEP_VALUE;
                    rangeMax.value = maxVal;
                }
            }

            minInput.value = minVal;
            maxInput.value = maxVal;

            const percentMin = (minVal - RANGE_MIN) / (RANGE_MAX - RANGE_MIN) * 100;
            const percentMax = (maxVal - RANGE_MIN) / (RANGE_MAX - RANGE_MIN) * 100;

            rangeFill.style.left = percentMin + '%';
            rangeFill.style.width = (percentMax - percentMin) + '%';
        }
        function updateFromInput() {
            let minVal = normalizeValue(minInput.value);
            let maxVal = normalizeValue(maxInput.value);
            if (minVal > maxVal) {
                [minVal, maxVal] = [maxVal, minVal];
            }
            rangeMin.value = minVal;
            rangeMax.value = maxVal;
            minInput.value = minVal;
            maxInput.value = maxVal;
        }

        rangeMin.addEventListener('input', (evt) => updateFromRange(evt.target));
        rangeMax.addEventListener('input', (evt) => updateFromRange(evt.target));

        minInput.addEventListener('change', () => {
            updateFromInput();
            updateFromRange(rangeMin);
        });
        maxInput.addEventListener('change', () => {
            updateFromInput();
            updateFromRange(rangeMin);
        });

        document.querySelectorAll('.filter-section h3').forEach((header) => {
            header.addEventListener('click', () => {
                const section = header.parentElement;
                section.classList.toggle('collapsed');
            });
        });

        // Khởi tạo giá trị đúng đầu
        updateFromInput();
        updateFromRange(rangeMin);
    </script>
</body>

</html>
