    <div class="container">

            <!-- Centered Search -->
            <div class="col px-lg-5 d-none d-md-block d-flex justify-content-center">

                    <input type="text" id="searchInput" placeholder="What are you looking for..." class="search-input w-100 bg-transparent border-0 shadow-none text-white">

            </div>

            <!-- User Actions & Mobile Toggle -->
            <div class="col-auto ms-auto d-flex align-items-center gap-3">

                    <div class="cart">

                                <span class="count-bubble" id="cartCountBubble">0</span>
                            </div>
                            <span class="small mt-1" style="font-size: 12px;">Cart</span>
                        </a>
                    </div>

                    <div class="account">
                        <a href="html/dangNhap.html" id="accountLink" class="d-flex flex-column align-items-center text-decoration-none text-white">
                            <img src="img/icon/mdi_account-circle.png" alt="account" style="width: 24px;">
                            <div class="d-flex flex-column align-items-center">
                                <span id="userNameDisplay" class="fw-bold" style="font-size: 12px; line-height: 1.1;">Login</span>
                                <span id="accountStatus" class="opacity-75 d-flex align-items-center gap-1" style="font-size: 10px;">

            </div>
        </div>
    </div> <!-- Kết thúc div.container -->

    <div class="category-navbar w-100 shadow-sm" id="main-navbar">
        <nav class="container">
            <ul class="nav-list w-100 justify-content-between align-items-center list-unstyled py-2 py-lg-0">
                <li class="nav-item"> <a href="html/banhang.html?category=shirts" data-category="shirts" class="category-link">Shirts & T-Shirts <span class="vietnamese">(Áo sơ mi và áo thun)</span></a></li>
                <li class="nav-item"> <a href="html/banhang.html?category=pants" data-category="pants" class="category-link">Pants <span class="vietnamese">(Quần)</span></a></li>
                <li class="nav-item"> <a href="html/banhang.html?category=jackets" data-category="jackets" class="category-link">Jackets <span class="vietnamese">(Áo khoác)</span></a></li>
                <li class="nav-item"> <a href="html/banhang.html?category=vests" data-category="vests" class="category-link">Vest <span class="vietnamese">(Áo Vest)</span></a></li>
                <li class="nav-item"> <a href="html/banhang.html?category=perfumes" data-category="perfumes" class="category-link">Perfumes <span class="vietnamese">(Nước hoa)</span></a></li>
                <li class="nav-item"> <a href="html/banhang.html?category=watches" data-category="watches" class="category-link">Watches <span class="vietnamese">(Đồng hồ)</span></a></li>
                <li class="nav-item"> <a href="html/banhang.html?category=caps" data-category="caps" class="category-link">Caps <span class="vietnamese">(Mũ)</span></a></li>
                <li class="nav-item"> <a href="html/banhang.html?category=shoes" data-category="shoes" class="category-link">Shoes <span class="vietnamese">(Giày)</span></a></li>
                <li class="nav-item"> <a href="html/banhang.html?category=accessories" data-category="accessories" class="category-link">Accessories <span class="vietnamese">(Phụ kiện)</span></a></li>
            </ul>
        </nav>
    </div>
    <div class="menu-overlay" id="menu-overlay"></div>
</header>

<script>
    // Lógica ẩn / hiện navbar khi cuộn chuột
    (function () {
        const header = document.querySelector('header');
        const navbar = document.getElementById('main-navbar');
        const overlay = document.getElementById('menu-overlay');
        const menuBtn = document.getElementById('mobile-menu-btn');

        // Kiểm tra nếu là trang giỏ hàng hoặc trang yêu thích
        const isSimplifiedPage = window.location.pathname.includes('cart.html') || window.location.pathname.includes('save.html');

        if (isSimplifiedPage) {
            if (header) header.classList.add('no-navbar');
        }

        let lastScrollY = window.scrollY;
        if (!navbar) return;

        window.addEventListener('scroll', () => {
            // Nếu là trang giỏ hàng hoặc yêu thích, không thay đổi header (không shrunk, không ẩn navbar)
            if (isSimplifiedPage) return;

            const headers = document.querySelectorAll('header');

            if (window.scrollY > lastScrollY && window.scrollY > 50) {
                // Lướt xuống -> ẩn navbar và thu nhỏ header
                navbar.classList.add('hidden');
                headers.forEach(h => h.classList.add('shrunk'));
            } else if (window.scrollY < lastScrollY) {
                // Lướt lên -> hiện navbar và phục hồi header
                navbar.classList.remove('hidden');
                headers.forEach(h => h.classList.remove('shrunk'));
            }
            lastScrollY = window.scrollY;
        });

        // Lógica tìm kiếm
        const searchInput = document.getElementById('searchInput');
        const searchButton = document.getElementById('searchButton');

        function handleSearch() {
            const query = searchInput.value.trim();
            if (query) {
                const isSubfolder = window.location.pathname.includes('/html/') || window.location.pathname.includes('/pages/');
                const targetPath = isSubfolder ? 'banhang.html' : 'html/banhang.html';
                window.location.href = targetPath + '?search=' + encodeURIComponent(query);
            }
        }

        if (searchButton && searchInput) {
            searchButton.addEventListener('click', handleSearch);
            searchInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') handleSearch();
            });
        }

        // Mobile menu toggle logic
        function toggleMenu(forceClose = false) {
            if (forceClose) {
                navbar.classList.remove('active');
                overlay.classList.remove('active');
                document.body.style.overflow = '';
            } else {
                navbar.classList.toggle('active');
                overlay.classList.toggle('active');
                
                if (navbar.classList.contains('active')) {
                    document.body.style.overflow = 'hidden'; // Prevent scrolling when menu is open
                } else {
                    document.body.style.overflow = '';
                }
            }

            const icon = menuBtn.querySelector('i');
            if (navbar.classList.contains('active')) {
                icon.classList.replace('fa-bars', 'fa-times');
            } else {
                icon.classList.replace('fa-times', 'fa-bars');
            }
        }

        if (menuBtn && navbar && overlay) {
            menuBtn.addEventListener('click', () => toggleMenu());
            overlay.addEventListener('click', () => toggleMenu(true));

            // Close menu when clicking a link (optional, good for SPAs but here we navigate)
            navbar.querySelectorAll('a').forEach(link => {
                link.addEventListener('click', () => toggleMenu(true));
            });
        }
    })();
</script>
