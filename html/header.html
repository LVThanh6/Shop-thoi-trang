<header>
    <div class="container">
        <div class="Top-nav">
            <div class="logo">
                <img src="../assets/icon/logo.png" alt="logo">
            </div>
            <div class="Search">
                <input type="text" id="searchInput" placeholder="What are you looking for...">
                <button type="button" id="searchButton">
                    <img src="../assets/icon/search.svg" alt="search">
                </button>
            </div>
            <div class="User-Actions">
                <div class="saved">
                    <span>
                        <a href="../html/save.html">
                            <img src="../assets/icon/tym.png" alt="tym">
                            <div>
                                <img src="../assets/icon/icon0.svg" alt="" style="width: 19px; height: 18px;">
                                <span>Saved</span>
                            </div>
                        </a>
                    </span>
                </div>
                <div class="cart">
                    <span>
                        <a href="../html/cart.html">
                            <img src="../assets/icon/mdi_cart-outline.png" alt="cart" id="cartHeaderBtn">
                            <div>
                                <img src="../assets/icon/icon9.svg" alt="" style="width: 19px; height: 18px;">
                                <span>Cart</span>
                            </div>
                        </a>
                    </span>
                </div>
                <div class="account">
                    <span>
                        <a href="../html/dangNhap.html" id="accountLink">
                            <img src="../assets/icon/mdi_account-circle.png" alt="account">
                            <div>
                                <span id="userNameDisplay">Login</span>
                                <span id="accountStatus">Account<img src="../assets/icon/rowbottom.svg" alt=""></span>
                            </div>
                        </a>
                    </span>
                </div>
            </div>
        </div>
    </div> <!-- Kết thúc div.container -->

    <div class="navbar" id="main-navbar">
        <nav class="nav-container">
            <ul>
                <li> <a href="../html/banhang.html?category=shirts" data-category="shirts">Shirts & T-Shirts <br>(Áo sơ
                        mi và áo thun)</a></li>
                <li> <a href="../html/banhang.html?category=pants" data-category="pants">Pants <br>(Quần)</a></li>
                <li> <a href="../html/banhang.html?category=jackets" data-category="jackets">Jackets <br>(Áo khoác)</a>
                </li>
                <li> <a href="../html/banhang.html?category=vests" data-category="vests">Vest <br>(Áo Vest)</a></li>
                <li> <a href="../html/banhang.html?category=perfumes" data-category="perfumes">Perfumes <br>(Nước
                        hoa)</a></li>
                <li> <a href="../html/banhang.html?category=watches" data-category="watches">Watches <br>(Đồng hồ)</a>
                </li>
                <li> <a href="../html/banhang.html?category=caps" data-category="caps">Caps <br>(Mũ)</a></li>
                <li> <a href="../html/banhang.html?category=shoes" data-category="shoes">Shoes <br>(Giày)</a></li>
                <li> <a href="../html/banhang.html?category=accessories" data-category="accessories">Accessories
                        <br>(Phụ kiện)</a></li>
            </ul>
        </nav>
    </div>
</header>

<script>
    // Lógica ẩn / hiện navbar khi cuộn chuột
    (function () {
        const header = document.querySelector('header');
        const navbar = document.getElementById('main-navbar');

        // Kiểm tra nếu là trang giỏ hàng hoặc trang save
        const isCartPage = window.location.pathname.includes('cart.html');
        const isSavePage = window.location.pathname.includes('save.html');

        if (isCartPage || isSavePage) {
            if (header) header.classList.add('no-navbar');
        }

        let lastScrollY = window.scrollY;
        if (!navbar) return;

        window.addEventListener('scroll', () => {
            const headers = document.querySelectorAll('header');

            if (window.scrollY > lastScrollY && window.scrollY > 50) {
                // Lướt xuống -> ẩn navbar và thu nhỏ header
                navbar.classList.add('hidden');
                headers.forEach(h => h.classList.add('shrunk'));
            } else if (window.scrollY < lastScrollY) {
                // Lướt lên -> hiện navbar và phục hồi header
                navbar.classList.remove('hidden');
                headers.forEach(h => h.classList.remove('shrunk'));
            }
            lastScrollY = window.scrollY;
        });

        // Lógica tìm kiếm
        const searchInput = document.getElementById('searchInput');
        const searchButton = document.getElementById('searchButton');

        function handleSearch() {
            const query = searchInput.value.trim();
            if (query) {
                // Điều hướng sang trang bán hàng với tham số tìm kiếm
                // Dùng cùng logic path như navbar
                window.location.href = '../html/banhang.html?search=' + encodeURIComponent(query);
            }
        }

        if (searchButton && searchInput) {
            searchButton.addEventListener('click', handleSearch);
            searchInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') handleSearch();
            });
        }
    })();
</script>
