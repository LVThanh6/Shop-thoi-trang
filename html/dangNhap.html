<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=Be+Vietnam+Pro:wght@100;200;300;400;500;600;700;800;900&family=Montserrat:wght@100..900&family=Plus+Jakarta+Sans:wght@200..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/dangNhap.css">
    <title>Đăng Nhập</title>
    <script src="../js/login.js"></script>
    <script src="../js/anmk.js"></script>
</head>

<body>
    <main>
        <div class="login-container">
            <div class="left-side">
                <div class="left-content">
                    <div class="circle-icon">
                        <img src="../img/dangnhapimg/Circle_Logo.svg" alt="">
                    </div>
                    <h2>Design with us</h2>
                    <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit. Morbi lobortis maximus nunc, ac rhoncus
                        odio congue quis. Sed ac semper orci, eu porttitor lacus.</p>
                </div>

            </div>

            <dziv class="right-side">
                <div class="breadcrumb">
                    <span><strong><a href="../index.html">Trang chủ</a>
                            <strong>></strong>
                        </strong><strong> Đăng nhập</strong></span>
                </div>

                <div class="login-wrapper">
                    <h1 class="login-title">Đăng nhập</h1>

                    <form action="#" class="login-form">

                        <div class="form-group">
                            <label for="email">Địa chỉ email:</label>
                            <div>
                                <input type="email" id="email" class="form-control" placeholder=" ">
                            </div>

                        </div>

                        <div class="form-group">
                            <div class="password-header">
                                <label for="password">Mật khẩu:</label>
                                <button type="button" class="toggle-password" id="toggle-password-btn">
                                    <div>
                                        <img id="eye-icon" src="../img/dangnhapimg/eye-closed.svg"
                                            alt="Ẩn/Hiện mật khẩu">
                                        <span id="toggle-text">Ẩn</span>
                                    </div>
                                </button>
                            </div>
                            <input type="password" id="password" class="form-control" placeholder=" ">
                        </div>

                        <div class="forgot-password">
                            <a href="#">Quên mật khẩu?</a>
                        </div>

                        <button type="submit" class="btn-submit" enabbled>Đăng nhập</button>
                    </form>

                    <div class="register-link">
                        <span>Chưa có tài khoản? <a href="../html/dangKy.html">Đăng ký ngay</a></span>
                    </div>

                    <div class="divider">
                        <span>Hoặc</span>
                    </div>

                    <div class="social-login">
                        <button class="btn-social btn-google">
                            <img src="../img/dangnhapimg/logo_media logo.svg" alt="Google"> Tiếp tục với Google
                        </button>
                        <button class="btn-social btn-facebook">
                            <img src="../img/dangnhapimg/facebook_media logo.png" alt="Facebook"> Tiếp tục với
                            Facebook
                        </button>
                    </div>

                </div>
        </div>
        </div>
    </main>
</body>

</html>
