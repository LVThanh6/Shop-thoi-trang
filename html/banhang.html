<!DOCTYPE html>
<html lang="vi">


<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sản phẩm - MEN Fashion</title>

    <!-- Google Fonts & Font Awesome -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet" />

    <!-- CSS -->
    <link rel="stylesheet" href="../assets/css/header.css">
    <link rel="stylesheet" href="../assets/css/footers.css">
    <link rel="stylesheet" href="../assets/css/main.css">
    <link rel="stylesheet" href="../assets/css/banhang.css">
    <link rel="stylesheet" href="../assets/css/filter.css">
    <link rel="stylesheet" href="../assets/css/banner.css">
    <link rel="stylesheet" href="../assets/css/product-detail.css">
    <link rel="stylesheet" href="../assets/css/toast.css">
</head>

<body class="shop-page">
    <div class="site-wrapper">
        <div id="header-placeholder"></div>

        <div id="banner-placeholder"></div>

        <div class="filter-toggle-btn" id="mobile-filter-btn">
            <i class="fas fa-filter"></i> Lọc sản phẩm
        </div>

        <main class="content-wrapper">
            <aside class="filter-area" id="filter-placeholder">
                <div class="filter-inner">
                    <!-- Khung bộ lọc sẽ nạp từ filter.html -->
                </div>
            </aside>

            <section class="product-area">
                <h2>Danh sách sản phẩm</h2>
                <div id="product-placeholder">
                    <!-- Dữ liệu sản phẩm sẽ được nạp tại đây -->
                </div>

                <!-- Nút xem thêm -->
                <div id="load-more-container" style="text-align: center; margin-top: 30px; display: none;">
                    <button id="load-more-btn" style="margin-bottom: 20px;">XEM THÊM SẢN PHẨM</button>
                </div>
            </section>
        </main>

        <footer id="footer-placeholder"></footer>

        <!-- Các phần ẩn: Giỏ hàng & Chi tiết sản phẩm -->
        <div id="cart-holder"></div>
        <div id="product-detail-holder"></div>
    </div>

    <!-- JavaScript -->
    <script src="../js/utils.js"></script>
    <script src="../js/giohang.js"></script>
    <script src="../js/shop.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const filterBtn = document.getElementById('mobile-filter-btn');
            const filterArea = document.querySelector('.filter-area');

            if (filterBtn && filterArea) {
                filterBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    filterArea.classList.toggle('active');
                });

                // Close when clicking outside
                document.addEventListener('click', (e) => {
                    if (filterArea.classList.contains('active') && !filterArea.contains(e.target) && e.target !== filterBtn) {
                        filterArea.classList.remove('active');
                    }
                });
            }
        });
    </script>
</body>

</html>
