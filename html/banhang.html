<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sản phẩm</title>
    <link rel="stylesheet" href="../assets/css/header.css">
    <link rel="stylesheet" href="../assets/css/footers.css">
    <link rel="stylesheet" href="../assets/css/main.css">
    <link rel="stylesheet" href="../assets/css/filter.css">
    <link rel="stylesheet" href="../assets/css/banner.css">
    <link rel="stylesheet" href="../assets/css/banhang.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link rel="stylesheet" href="../assets/css/product-detail.css">
</head>

<body class="shop-page">
    <div class="site-wrapper">
        <div id="header-placeholder"></div>

        <!-- Banner nạp động thay vì iframe -->
        <div id="banner-placeholder"></div>

        <div class="content-wrapper">
            <div class="filter-area" id="filter-placeholder">
                <div class="filter-inner">
                    <!-- Khung bộ lọc sẽ nạp từ filter.html -->
                </div>
            </div>

            <div class="product-area">
                <h2>Danh sách sản phẩm</h2>
                <div id="product-placeholder">
                    <!-- Sản phẩm sẽ được nạp từ JSON qua shop.js -->
                </div>
                <!-- Nút Xem thêm -->
                <div id="load-more-container" style="display: none; text-align: center; margin-top: 40px; margin-bottom: 20px;">
                    <button id="load-more-btn" class="btn-load-more">Xem thêm</button>
                </div>
            </div>
        </div>

        <div id="footer-placeholder"></div>
        <div id="cart-holder"></div>
        <div id="product-detail-holder"></div>
    </div>

    <!-- JavaScript -->
    <script src="../js/utils.js"></script>
    <script src="../js/giohang.js"></script>
    <script src="../js/shop.js"></script>
</body>



</html>
