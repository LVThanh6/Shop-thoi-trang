<!DOCTYPE html>

<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=Be+Vietnam+Pro:wght@100;200;300;400;500;600;700;800;900&family=Montserrat:wght@100..900&family=Plus+Jakarta+Sans:wght@200..800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../css/dangKy.css">
    <script src="../js/register.js"></script>
</head>

<body>

    <div class="register-container">
        <div class="register-wrapper">

            <div class="breadcrumb">
                <span><strong><a href="../index.html">Trang chủ</a>
                        <strong>></strong>
                    </strong><strong> Đăng ký</strong></span>
            </div>

            <form class="register-form" action="/register" method="POST">
                <h1>Đăng ký tài khoản</h1>


                <div class="form-group">
                    <label for="email">Địa chỉ email</label>
                    <div>
                        <input type="email" id="email" name="email" placeholder="" required>
                    </div>



                </div>


                <div class="form-group">
                    <label for="password">Mật khẩu</label>
                    <div>
                        <input type="password" id="password" name="password" placeholder="" required>
                    </div>
                </div>


                <div class="form-group">
                    <label for="confirmPassword">Nhập lại mật khẩu</label>
                    <div>
                        <input type="password" id="confirmPassword" name="confirmPassword" placeholder="" required>
                    </div>
                </div>

                <button type="submit" class="btn-submit">Đăng ký</button>


            </form>

            <div class="have-account">
                <span>Đã có tài khoản?
                    <a href="../html/dangNhap.html">Đăng nhập</a>
                </span>
            </div>

            <div class="divider">
                <span>hoặc</span>
            </div>

            <div class="social-login">
                <button type="button" class="btn-social btn-google">
                    <img src="../img/dangnhapimg/logo_media logo.svg" alt="Google logo">
                    Tiếp tục với Google
                </button>

                <button type="button" class="btn-social btn-facebook">
                    <img src="../img/dangnhapimg/facebook_media logo.png" alt="Facebook logo">
                    Tiếp tục với Facebook
                </button>
            </div>

        </div>
    </div>


</body>

</html>
